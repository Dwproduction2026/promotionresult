<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승진 심의 결과 조회 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dw:#E87722;--dw2:#c05a0a;
  --bg:#F5F4F2;--surface:#fff;--surface2:#F9F8F6;--surface3:#EEECEA;
  --border:#E2DED9;--border2:#ccc;
  --text:#1a1a1a;--text2:#444;--text3:#777;--text4:#bbb;
  --green:#2A7D4F;--red:#C8410A;--blue:#1A4F6B;--purple:#4A3A8C;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden;}
.screen.active{display:flex;}

/* SPLASH */
#splash{background:linear-gradient(135deg,#FFF4E8,#FDE8CC);align-items:center;justify-content:center;position:relative;overflow:hidden;}
#splash::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--dw),var(--dw2));}
.sp-deco{position:absolute;font-family:'Bebas Neue',sans-serif;color:rgba(232,119,34,.05);font-size:260px;right:-20px;bottom:-20px;user-select:none;line-height:1;}
.sp-inner{position:relative;z-index:1;text-align:center;padding:0 24px;}
.sp-tag{display:inline-block;padding:5px 18px;border:1px solid rgba(232,119,34,.3);font-size:11px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:22px;}
.sp-h{font-size:clamp(34px,5vw,56px);font-weight:900;line-height:1.1;margin-bottom:8px;}
.sp-h span{color:var(--dw);}
.sp-sub{font-size:13px;color:var(--text3);margin-bottom:36px;line-height:1.9;}
.sp-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.sp-btn{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:14px 36px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border-radius:2px;transition:all .2s;min-width:150px;}
.sp-btn.primary{background:var(--dw);color:#fff;box-shadow:0 4px 18px rgba(232,119,34,.28);}
.sp-btn.primary:hover{background:var(--dw2);transform:translateY(-2px);}
.sp-btn.dark{background:#2c3140;color:#fff;}
.sp-btn.dark:hover{background:#3a4156;}
.sp-btn small{font-size:11px;font-weight:400;opacity:.7;}
.sp-contact{margin-top:28px;font-size:12px;color:var(--text4);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.sp-inner>*{animation:fadeUp .5s both;}
.sp-tag{animation-delay:.0s;}.sp-h{animation-delay:.1s;}.sp-sub{animation-delay:.15s;}.sp-btns{animation-delay:.2s;}.sp-contact{animation-delay:.3s;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border-radius:2px;padding:28px;width:100%;max-width:420px;position:relative;border-top:3px solid var(--dw);}
.modal-x{position:absolute;top:12px;right:14px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);font-family:inherit;}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 24px;border-radius:100px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}

/* FORM */
.fl{display:block;font-size:11px;font-weight:700;color:var(--text3);margin-bottom:5px;letter-spacing:.8px;text-transform:uppercase;}
.fi,.fs{width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;outline:none;border-radius:2px;font-family:inherit;transition:border .15s;}
.fi:focus,.fs:focus{border-color:var(--dw);background:var(--surface);}
.fhint{font-size:11px;color:var(--text4);margin-top:4px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:2px;transition:all .15s;}
.btn-p{background:var(--dw);color:#fff;}.btn-p:hover{background:var(--dw2);}
.btn-s{background:var(--surface2);border:1px solid var(--border);color:var(--text2);}.btn-s:hover{background:var(--surface3);}
.btn-d{background:rgba(200,65,10,.07);border:1px solid rgba(200,65,10,.2);color:var(--red);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-full{width:100%;justify-content:center;}

/* PAGE */
.ph{background:var(--surface);border-bottom:1px solid var(--border);border-top:3px solid var(--dw);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ph-title{font-size:16px;font-weight:800;}
.ph-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.pb{flex:1;overflow-y:auto;padding:22px 26px;}

/* ADMIN SIDEBAR */
#adminScreen{flex-direction:row;}
.aside{width:196px;background:#1e2435;display:flex;flex-direction:column;flex-shrink:0;}
.aside-logo{padding:18px 14px;border-bottom:1px solid rgba(255,255,255,.07);}
.aside-logo-t{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--dw);letter-spacing:1px;}
.aside-logo-s{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px;}
.aside-nav{padding:8px;flex:1;}
.anav{display:flex;align-items:center;gap:8px;padding:9px 11px;color:rgba(255,255,255,.48);font-size:12px;font-weight:600;cursor:pointer;border-radius:2px;margin-bottom:2px;width:100%;background:none;border:none;font-family:inherit;text-align:left;transition:all .14s;}
.anav:hover{background:rgba(255,255,255,.06);color:#fff;}
.anav.on{background:rgba(232,119,34,.16);color:var(--dw);}
.aside-user{padding:11px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:rgba(255,255,255,.35);}
.amain{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ahead{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ahead-title{font-size:16px;font-weight:800;}
.ahead-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.abody{flex:1;overflow-y:auto;padding:20px 22px;}

/* RESULT SCREEN */
#resultScreen{flex-direction:column;}
.rh{background:var(--surface);border-bottom:1px solid var(--border);border-top:3px solid var(--dw);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-shrink:0;}
.rb{flex:1;overflow-y:auto;padding:20px 24px;}

/* TABLE */
.tc{background:var(--surface);border:1px solid var(--border);border-radius:2px;overflow:hidden;margin-bottom:14px;}
.tt{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface2);}
.tt-title{font-size:13px;font-weight:800;}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{padding:8px 11px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;background:var(--surface2);border-bottom:1px solid var(--border);}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--surface2);}
.tbl tbody tr.clik{cursor:pointer;}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border:1px solid var(--border);font-size:11px;font-weight:600;border-radius:2px;background:var(--surface2);}
.tag-pass{background:rgba(42,125,79,.08);border-color:rgba(42,125,79,.2);color:var(--green);}
.tag-fail{background:rgba(200,65,10,.08);border-color:rgba(200,65,10,.2);color:var(--red);}
.fsel{padding:6px 10px;border:1px solid var(--border);background:var(--surface2);font-family:inherit;font-size:12px;outline:none;border-radius:2px;color:var(--text);}

/* STAT */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:16px 14px;}
.stat-icon{font-size:18px;margin-bottom:8px;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--dw);line-height:1;}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:4px;}

/* DETAIL MODAL */
.detail-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;padding:20px;}
.detail-modal-bg.open{display:flex;}
.detail-modal{background:var(--surface);border-radius:2px;width:100%;max-width:580px;max-height:88vh;overflow-y:auto;border-top:3px solid var(--dw);position:relative;}
.dm-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}
.dm-name{font-size:20px;font-weight:900;margin-bottom:3px;}
.dm-meta{font-size:12px;color:var(--text3);}
.dm-x{position:absolute;top:14px;right:16px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);font-family:inherit;}
.dm-body{padding:20px 24px;}
.dm-result{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:2px;margin-bottom:16px;}
.dm-result.pass{background:rgba(42,125,79,.06);border:1px solid rgba(42,125,79,.2);}
.dm-result.fail{background:rgba(200,65,10,.06);border:1px solid rgba(200,65,10,.2);}
.dm-result-icon{font-size:28px;}
.dm-result-val{font-size:20px;font-weight:900;}
.dm-result.pass .dm-result-val{color:var(--green);}
.dm-result.fail .dm-result-val{color:var(--red);}
.dm-result-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.info-item{background:var(--surface2);border:1px solid var(--border);padding:11px 13px;border-radius:2px;}
.info-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.info-val{font-size:13px;font-weight:600;color:var(--text);}
.feedback-box{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--dw);padding:14px 16px;border-radius:2px;}
.feedback-lbl{font-size:10px;font-weight:700;color:var(--dw);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.feedback-txt{font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap;}

/* FCARD */
.fcard{background:var(--surface);border:1px solid var(--border);padding:20px;margin-bottom:14px;border-radius:2px;}
.fcard-title{font-size:13px;font-weight:800;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:8px;}
.fcard-title::before{content:'';width:3px;height:13px;background:var(--dw);display:block;border-radius:2px;}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--text4);}
.empty-icon{font-size:36px;margin-bottom:10px;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:100px;}
</style>
</head>
<body>

<div id="toast"></div>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <div class="sp-deco">DW</div>
  <div class="sp-inner">
    <div class="sp-tag">Promotion Review System</div>
    <div class="sp-h">승진 심의<br><span>결과 조회 시스템</span></div>
    <div class="sp-sub">로그인 후 심의 결과를 확인하세요<br>Login to View Promotion Review Results</div>
    <div class="sp-btns">
      <button class="sp-btn primary" onclick="openModal('m-login')">
        🔍 결과 조회
        <small>Manager Login</small>
      </button>
      <button class="sp-btn dark" onclick="openModal('m-admin')">
        ⚙️ 관리자
        <small>Admin</small>
      </button>
    </div>
    <div class="sp-contact">문의: 생산지원팀</div>
  </div>
</div>

<!-- 팀장 로그인 모달 -->
<div class="modal-bg" id="m-login">
  <div class="modal">
    <button class="modal-x" onclick="closeModal('m-login')">X</button>
    <div class="modal-title">팀장 로그인</div>
    <div class="modal-sub">사번과 비밀번호를 입력하세요</div>
    <div style="margin-bottom:11px"><label class="fl">사번</label><input class="fi" id="l-id" placeholder="사번"></div>
    <div style="margin-bottom:14px"><label class="fl">비밀번호</label><input class="fi" id="l-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLeaderLogin()"></div>
    <div id="l-err" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none">사번 또는 비밀번호가 올바르지 않습니다</div>
    <button class="btn btn-p btn-full" onclick="doLeaderLogin()">결과 조회하기</button>
  </div>
</div>

<!-- 관리자 로그인 모달 -->
<div class="modal-bg" id="m-admin">
  <div class="modal">
    <button class="modal-x" onclick="closeModal('m-admin')">X</button>
    <div class="modal-title">관리자 로그인</div>
    <div style="margin-bottom:11px"><label class="fl">ID</label><input class="fi" id="a-id" placeholder="관리자 ID"></div>
    <div style="margin-bottom:14px"><label class="fl">비밀번호</label><input class="fi" id="a-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
    <div id="a-err" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none">ID 또는 비밀번호가 올바르지 않습니다</div>
    <button class="btn btn-p btn-full" onclick="doAdminLogin()">관리자 입장</button>
  </div>
</div>

<!-- 결과 조회 화면 (팀장용) -->
<div id="resultScreen" class="screen">
  <div class="rh">
    <div>
      <div style="font-size:15px;font-weight:800">승진 심의 결과 조회</div>
      <div id="r-userinfo" style="font-size:11px;color:var(--text3);margin-top:2px"></div>
    </div>
    <button class="btn btn-s btn-sm" onclick="doLogout()">로그아웃</button>
  </div>
  <div class="rb" id="result-body">
    <div class="empty"><div class="empty-icon">📋</div><div>불러오는 중...</div></div>
  </div>
</div>

<!-- 관리자 화면 -->
<div id="adminScreen" class="screen" style="flex-direction:row">
  <div class="aside">
    <div class="aside-logo">
      <div class="aside-logo-t">승진 심의</div>
      <div class="aside-logo-s">관리자 페이지</div>
    </div>
    <div class="aside-nav">
      <button class="anav on" onclick="adminGo('data')">📊 데이터 관리</button>
      <button class="anav" onclick="adminGo('leaders')">👑 팀장 계정</button>
      <button class="anav" onclick="adminGo('settings')">⚙️ 설정</button>
    </div>
    <div class="aside-user">관리자 · admin</div>
  </div>
  <div class="amain">
    <div class="ahead">
      <div>
        <div class="ahead-title" id="admin-page-title">데이터 관리</div>
        <div class="ahead-sub" id="admin-page-sub">심의 결과 데이터 불러오기</div>
      </div>
      <button class="btn btn-s btn-sm" onclick="doLogout()">로그아웃</button>
    </div>
    <div class="abody" id="admin-body"></div>
  </div>
</div>

<!-- 상세 모달 -->
<div class="detail-modal-bg" id="detail-modal">
  <div class="detail-modal">
    <div class="dm-header">
      <div class="dm-name" id="dm-name"></div>
      <div class="dm-meta" id="dm-meta"></div>
      <button class="dm-x" onclick="closeDetailModal()">X</button>
    </div>
    <div class="dm-body" id="dm-body"></div>
  </div>
</div>

<script>
var ADMIN_ID  = 'adminhr';
var ADMIN_PW  = 'adminhr000';
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/1hgubqs2UulKJoRJHGTTj_fewL4Ez_0YyTTrNRBj5Z7U/edit?usp=sharing';
var DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxye5y3h4sLNvj-PWSS-TR2jDd0EUTDRoK7PhUIIC0jbGaeodqUNGq_qQvN3V5FKjTg/exec';

var scriptUrl = localStorage.getItem('prom_url') || '';
var allData   = [];
var leaders   = {};
var currentUser = null;
var adminView = 'data';

function el(id){ return document.getElementById(id); }
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function val(id){ var e=el(id); return e ? e.value.trim() : ''; }

function go(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  el(id).classList.add('active');
}
function toast(msg){
  var t=el('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function openModal(id){ el(id).classList.add('open'); }
function closeModal(id){ el(id).classList.remove('open'); }

function loadSaved(){
  scriptUrl = localStorage.getItem('prom_url') || DEFAULT_SCRIPT_URL;
  var d = localStorage.getItem('prom_data');
  if(d){ try{ allData = JSON.parse(d); }catch(e){} }
  var ld = localStorage.getItem('prom_leaders');
  if(ld){ try{ leaders = JSON.parse(ld); }catch(e){} }
}
loadSaved();

// 앱 시작 시 백그라운드로 최신 데이터 자동 fetch (관리자 설정 없이도 동작)
document.addEventListener('DOMContentLoaded', function(){
  autoLoadAll();
});

function saveLeaders(){ localStorage.setItem('prom_leaders', JSON.stringify(leaders)); }

/* ============ 자동 FETCH (로그인 시) ============ */
async function fetchFromSheets(sheetName){
  if(!scriptUrl) return null;
  try{
    var res  = await fetch(scriptUrl+'?sheet='+encodeURIComponent(sheetName), {redirect:'follow'});
    var json = await res.json();
    if(!Array.isArray(json)||json.length<2) return null;
    return json;
  }catch(e){ return null; }
}

async function autoLoadAll(onDone){
  // 심의결과 fetch
  var resultJson = await fetchFromSheets('심의결과');
  if(resultJson){
    var rows = resultJson.slice(1).filter(function(r){
      var notEmpty = r.some(function(c){ return c!==''; });
      var active   = String(r[13]||'').trim().toUpperCase() === 'Y'; // N열: 활성화
      return notEmpty && active;
    });
    var grouped = {}, order = [];
    rows.forEach(function(r){
      var empNo = String(r[0]||'').trim();
      if(!empNo) return;
      if(!grouped[empNo]){
        order.push(empNo);
        grouped[empNo] = {
          empNo:empNo, name:String(r[1]||'').trim(), dept:String(r[2]||'').trim(),
          center:String(r[3]||'').trim(), team:String(r[4]||'').trim(),
          curJob:String(r[5]||'').trim(), tgtJob:String(r[6]||'').trim(),
          criteria:String(r[7]||'').trim(), type:String(r[8]||'').trim(),
          result:String(r[9]||'').trim(), reviewers:[]
        };
      }
      var reviewer = String(r[12]||r[10]||'').trim();
      var feedback = String(r[11]||'').trim();
      if(reviewer||feedback) grouped[empNo].reviewers.push({reviewer:reviewer, feedback:feedback});
    });
    allData = order.map(function(empNo){ return grouped[empNo]; });
    localStorage.setItem('prom_data', JSON.stringify(allData));
  }

  // 팀장계정 fetch
  var leaderJson = await fetchFromSheets('관리자');
  if(leaderJson){
    var lrows = leaderJson.slice(1).filter(function(r){ return r.some(function(c){ return c!==''; }); });
    var newLeaders = {};
    lrows.forEach(function(r){
      var id=String(r[0]||'').trim(), name=String(r[1]||'').trim();
      var dept=String(r[2]||'').trim(), pw=String(r[3]||'').trim();
      if(!id||!name||!pw) return;
      if(!newLeaders[id]) newLeaders[id]={name:name, dept:dept, pw:pw, teams:[]};
      if(dept&&!newLeaders[id].teams.includes(dept)) newLeaders[id].teams.push(dept);
    });
    if(Object.keys(newLeaders).length){
      leaders = newLeaders;
      saveLeaders();
    }
  }

  if(onDone) onDone();
}

/* ============ AUTH ============ */
async function doLeaderLogin(){
  var id = val('l-id'), pw = val('l-pw');

  // 먼저 로컬 데이터로 1차 검증
  var ldr = leaders[id];
  if(!ldr || ldr.pw !== pw){
    // 시트에서 최신 정보 불러와서 재검증
    var loginBtn = document.querySelector('#m-login .btn-full');
    if(loginBtn){ loginBtn.textContent='확인 중...'; loginBtn.disabled=true; }
    await autoLoadAll();
    if(loginBtn){ loginBtn.textContent='결과 조회하기'; loginBtn.disabled=false; }
    ldr = leaders[id];
    if(!ldr || ldr.pw !== pw){ el('l-err').style.display='block'; return; }
  }

  el('l-err').style.display='none';
  currentUser = {id:id, name:ldr.name, dept:ldr.dept, teams:ldr.teams||[ldr.dept], pw:ldr.pw, isAdmin:false};
  closeModal('m-login');
  go('resultScreen');
  el('r-userinfo').textContent = ldr.name + ' (' + currentUser.teams.join(', ') + ')';
  window._activeTeam = currentUser.teams[0];

  // 로그인 성공 후 최신 데이터 자동 fetch
  var body = el('result-body');
  body.innerHTML = '<div class="empty"><div class="empty-icon">🔄</div><div>최신 데이터 불러오는 중...</div></div>';
  await autoLoadAll();
  renderResultScreen();
}

/* ============ RESULT SCREEN ============ */
function renderResultScreen(){
  var teams = currentUser.teams || [currentUser.dept];
  var allTabs = ['전체'].concat(teams);

  // _activeTeam 초기화: '전체' 또는 팀명
  if(!window._activeTeam || (!allTabs.includes(window._activeTeam))) window._activeTeam = '전체';
  var activeTeam = window._activeTeam;

  // 현재 탭 데이터
  var myRows = activeTeam === '전체'
    ? allData.filter(function(r){ return teams.includes(r.team); })
    : allData.filter(function(r){ return r.team === activeTeam; });

  var body = el('result-body');
  var html = '<div style="max-width:1100px;margin:0 auto">';

  // 탭 (전체 + 각 팀)
  html += '<div style="display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap">';
  allTabs.forEach(function(tab){
    var on = tab === activeTeam;
    html += '<button onclick="switchTeamTab(\''+h(tab)+'\')" style="padding:9px 20px;background:none;border:none;border-bottom:2px solid '+(on?'var(--dw)':'transparent')+';margin-bottom:-2px;cursor:pointer;font-size:13px;font-weight:'+(on?800:600)+';color:'+(on?'var(--dw)':'var(--text3)')+';font-family:inherit;transition:all .15s">'+(tab==='전체'?'🗂 전체':h(tab))+'</button>';
  });
  html += '</div>';

  if(!myRows.length){
    html += '<div class="empty"><div class="empty-icon">📋</div><div style="font-size:14px;margin-bottom:6px">'+(activeTeam==='전체'?'데이터가 없습니다':h(activeTeam)+'의 심의 결과가 없습니다')+'</div><div style="font-size:12px;color:var(--text4)">관리자에게 문의하세요</div></div></div>';
    body.innerHTML = html;
    return;
  }

  var pass = myRows.filter(function(r){ return r.result==='합격'; }).length;
  var fail = myRows.length - pass;
  var rate = Math.round(pass/myRows.length*100);
  var lbl  = activeTeam === '전체' ? '전체' : activeTeam;

  // 통계 카드
  html += '<div class="stat-grid">';
  html += '<div class="stat-card"><div class="stat-icon">📋</div><div class="stat-val">'+myRows.length+'</div><div class="stat-lbl">'+h(lbl)+' 심의 인원</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">✅</div><div class="stat-val" style="color:var(--green)">'+pass+'</div><div class="stat-lbl">합격</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">❌</div><div class="stat-val" style="color:var(--red)">'+fail+'</div><div class="stat-lbl">불합격</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">📈</div><div class="stat-val" style="color:var(--blue)">'+rate+'%</div><div class="stat-lbl">합격률</div></div>';
  html += '</div>';

  // 직무별 그래프
  var jobMap = {};
  myRows.forEach(function(r){
    var job = r.tgtJob || '미지정';
    if(!jobMap[job]) jobMap[job] = {pass:0, fail:0};
    if(r.result==='합격') jobMap[job].pass++;
    else jobMap[job].fail++;
  });
  var jobs = Object.keys(jobMap).sort();
  var maxVal = Math.max.apply(null, jobs.map(function(j){ return jobMap[j].pass + jobMap[j].fail; }));

  html += '<div class="tc" style="margin-bottom:14px"><div class="tt"><div class="tt-title">📊 직무(급수)별 합격 / 불합격 현황</div></div>';
  html += '<div style="padding:16px 18px">';
  jobs.forEach(function(job){
    var p = jobMap[job].pass, f = jobMap[job].fail, tot = p+f;
    var pPct = maxVal ? Math.round(p/maxVal*100) : 0;
    var fPct = maxVal ? Math.round(f/maxVal*100) : 0;
    var rPct = Math.round(p/tot*100);
    html += '<div style="margin-bottom:14px">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">';
    html += '<span style="font-size:12px;font-weight:700;color:var(--text)">'+h(job)+'</span>';
    html += '<span style="font-size:11px;color:var(--text3)">총 '+tot+'명 &nbsp;|&nbsp; <span style="color:var(--green);font-weight:700">합격 '+p+'</span> &nbsp; <span style="color:var(--red);font-weight:700">불합격 '+f+'</span> &nbsp; <span style="color:var(--blue)">합격률 '+rPct+'%</span></span>';
    html += '</div>';
    html += '<div style="display:flex;gap:3px;align-items:center">';
    // 합격 바
    if(pPct > 0) html += '<div style="height:22px;width:'+pPct+'%;background:var(--green);border-radius:2px 0 0 2px;display:flex;align-items:center;justify-content:center;transition:width .4s"><span style="font-size:10px;color:#fff;font-weight:700;padding:0 4px;white-space:nowrap">'+(pPct>12?p+'명':'')+'</span></div>';
    // 불합격 바
    if(fPct > 0) html += '<div style="height:22px;width:'+fPct+'%;background:var(--red);opacity:.75;border-radius:'+(pPct===0?'2px':'0')+'2px 2px '+(pPct===0?'2px':'0')+';display:flex;align-items:center;justify-content:center;transition:width .4s"><span style="font-size:10px;color:#fff;font-weight:700;padding:0 4px;white-space:nowrap">'+(fPct>12?f+'명':'')+'</span></div>';
    html += '</div></div>';
  });
  html += '</div></div>';

  // 필터
  var types = [];
  myRows.forEach(function(r){ if(r.type&&!types.includes(r.type)) types.push(r.type); });
  var typeOpts = '<option value="">전체 유형</option>';
  types.forEach(function(t){ typeOpts += '<option value="'+h(t)+'">'+h(t)+'</option>'; });

  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">';
  html += '<select class="fsel" id="f-res" onchange="filterResult()"><option value="">전체</option><option value="합격">합격</option><option value="불합격">불합격</option></select>';
  html += '<select class="fsel" id="f-type" onchange="filterResult()">'+typeOpts+'</select>';
  html += '<input style="padding:7px 11px;border:1px solid var(--border);background:var(--surface2);font-family:inherit;font-size:12px;outline:none;border-radius:2px;flex:1;min-width:160px;color:var(--text)" id="f-srch" placeholder="이름 또는 사번 검색..." oninput="filterResult()">';
  html += '<span id="f-count" style="font-size:12px;color:var(--text3);margin-left:auto"><strong>'+myRows.length+'</strong>명</span>';
  html += '</div>';

  // 테이블 (전체 탭이면 팀 열 추가)
  var isAll = activeTeam === '전체';
  html += '<div class="tc"><table class="tbl"><thead><tr>';
  html += '<th>사번</th><th>성명</th>'+(isAll?'<th>팀</th>':'')+'<th>현직무</th><th>지원직무</th><th>심의기준</th><th>심의유형</th><th>면접관</th><th>합격여부</th><th>상세</th>';
  html += '</tr></thead><tbody id="result-tbody">';
  html += getResultRows(myRows, isAll);
  html += '</tbody></table></div></div>';

  body.innerHTML = html;
  window._myRows = myRows;
  window._isAll  = isAll;
  window._filteredRows = null;
}

function switchTeamTab(team){
  window._activeTeam = team;
  renderResultScreen();
}

function getResultRows(rows, isAll){
  if(!rows.length) return '<tr><td colspan="'+(isAll?10:9)+'" style="text-align:center;padding:28px;color:var(--text4)">검색 결과가 없습니다</td></tr>';
  return rows.map(function(r, i){
    var pass     = r.result === '합격';
    var tagCls   = pass ? 'tag tag-pass' : 'tag tag-fail';
    var icon     = pass ? '✅ ' : '❌ ';
    var revCount = (r.reviewers||[]).length;
    var revLabel = revCount > 0
      ? '<span class="tag" style="color:var(--blue)">' + revCount + '명</span>'
      : '<span style="color:var(--text4);font-size:11px">-</span>';
    return '<tr class="clik" onclick="openDetail('+i+')">'
      +'<td style="font-size:11px;font-family:monospace;color:var(--text3)">'+h(r.empNo)+'</td>'
      +'<td style="font-weight:700">'+h(r.name)+'</td>'
      +(isAll?'<td><span class="tag">'+h(r.team||'-')+'</span></td>':'')
      +'<td><span class="tag">'+h(r.curJob||'-')+'</span></td>'
      +'<td><span class="tag">'+h(r.tgtJob||'-')+'</span></td>'
      +'<td style="font-size:12px;color:var(--text2)">'+h(r.criteria||'-')+'</td>'
      +'<td><span class="tag">'+h(r.type||'-')+'</span></td>'
      +'<td>'+revLabel+'</td>'
      +'<td><span class="'+tagCls+'">'+icon+h(r.result)+'</span></td>'
      +'<td><button onclick="event.stopPropagation();openDetail('+i+')" class="btn btn-s btn-sm">상세</button></td>'
      +'</tr>';
  }).join('');
}

function filterResult(){
  if(!window._myRows) return;
  var res  = (el('f-res')||{}).value  || '';
  var type = (el('f-type')||{}).value || '';
  var srch = ((el('f-srch')||{}).value||'').toLowerCase().trim();
  var filtered = window._myRows.filter(function(r){
    if(res  && r.result !== res)  return false;
    if(type && r.type   !== type) return false;
    if(srch && !r.name.toLowerCase().includes(srch) && !r.empNo.toLowerCase().includes(srch)) return false;
    return true;
  });
  var tb = el('result-tbody');
  if(tb) tb.innerHTML = getResultRows(filtered, window._isAll);
  var fc = el('f-count');
  if(fc) fc.textContent = filtered.length + '명';
  window._filteredRows = filtered;
}

  html += '</div>';

  // 면접관별 피드백

      html += '</div>';
      if(rv.feedback){
        html += '<div style="padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap">'+h(rv.feedback)+'</div>';
      } else {
        html += '<div style="padding:12px 14px;font-size:13px;color:var(--text4)">피드백 내용 없음</div>';
      }
      html += '</div>';
    });
  } else {
    html += '<div class="feedback-box"><div class="feedback-lbl">피드백 내용</div>';
    html += '<div class="feedback-txt" style="color:var(--text4)">피드백 내용이 없습니다</div></div>';

  el('dm-body').innerHTML = html;
  el('detail-modal').classList.add('open');
}

async function loadResultData(){
  if(!scriptUrl){ toast('설정 탭에서 URL을 먼저 입력하세요'); return; }
  var sheet = val('d-sheet') || '심의결과';
  var stEl  = el('d-status');
  if(stEl) stEl.innerHTML = '<span style="color:var(--dw)">불러오는 중...</span>';
  try{
    var res  = await fetch(scriptUrl+'?sheet='+encodeURIComponent(sheet), {redirect:'follow'});
    var json = await res.json();
    if(!Array.isArray(json)||json.length<2){
      if(stEl) stEl.innerHTML='<span style="color:var(--red)">데이터 없음 또는 형식 오류</span>'; return;
    }
    var rows = json.slice(1).filter(function(r){
      var notEmpty = r.some(function(c){ return c!==''; });
      var active   = String(r[13]||'').trim().toUpperCase() === 'Y'; // N열: 활성화
      return notEmpty && active;
    });

    // 사번 기준으로 그룹화 (같은 사번 = 여러 평가자 → 하나로 묶기)
    var grouped = {};
    var order   = [];
    rows.forEach(function(r){
      var empNo = String(r[0]||'').trim();
      if(!empNo) return;
      if(!grouped[empNo]){
        order.push(empNo);
        grouped[empNo] = {
          empNo:    empNo,
          name:     String(r[1]||'').trim(),
          dept:     String(r[2]||'').trim(),
          center:   String(r[3]||'').trim(),
          team:     String(r[4]||'').trim(),
          curJob:   String(r[5]||'').trim(),
          tgtJob:   String(r[6]||'').trim(),
          criteria: String(r[7]||'').trim(),
          type:     String(r[8]||'').trim(),
          result:   String(r[9]||'').trim(),
          reviewers: [],  // [{reviewer, feedback}]
        };
      }
      // 면접관 및 피드백 추가 (M열 = 익명번호 우선, K열 = 면접관명)
      var reviewer = String(r[12]||r[10]||'').trim();
      var feedback = String(r[11]||'').trim();
      if(reviewer || feedback){
        grouped[empNo].reviewers.push({reviewer:reviewer, feedback:feedback});
      }
    });
    allData = order.map(function(empNo){ return grouped[empNo]; });
    localStorage.setItem('prom_data', JSON.stringify(allData));
    if(stEl) stEl.innerHTML='<span style="color:var(--green)">✅ '+allData.length+'건 불러옴 ('+new Date().toLocaleTimeString('ko')+')</span>';
    toast('✅ '+allData.length+'건 불러왔습니다');
    renderAdminData();
  }catch(err){
    if(stEl) stEl.innerHTML='<span style="color:var(--red)">오류: '+err.message+'</span>';
  }
}

  // Sheets 불러오기
  html += '<div class="fcard"><div class="fcard-title">☁️ 관리자 시트에서 불러오기</div>';
  html += '<div style="font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.8"><b>시트 열 구조:</b> A:사번 &nbsp; B:성명 &nbsp; C:부서 &nbsp; D:비밀번호</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:8px">';
  html += '<input class="fi" id="l-sheet" value="관리자" placeholder="시트명" style="flex:1">';
  html += '<button class="btn btn-p" '+(hasUrl?'':'disabled')+' onclick="loadLeadersFromSheets()">📥 불러오기</button>';
  html += '</div><div id="l-status" style="font-size:12px;color:var(--text3)"></div></div>';

  // 직접 추가
  html += '<div class="fcard"><div class="fcard-title">직접 추가</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px">';
  html += '<div><label class="fl">사번</label><input class="fi" id="new-id" placeholder="사번" style="font-size:12px"></div>';
  html += '<div><label class="fl">이름</label><input class="fi" id="new-name" placeholder="이름" style="font-size:12px"></div>';
  html += '<div><label class="fl">팀명</label><input class="fi" id="new-dept" placeholder="예: 오송QC1팀" style="font-size:12px"></div>';
  html += '<div><label class="fl">비밀번호</label><input class="fi" id="new-pw" placeholder="비밀번호" style="font-size:12px;font-family:monospace"></div>';
  html += '</div>';
  html += '<button class="btn btn-p" onclick="addLeader()">+ 추가</button></div>';

  // 목록
  html += '<div class="fcard"><div class="fcard-title">팀장 목록 ('+entries.length+'명)</div>';
  if(!entries.length){
    html += '<div class="empty"><div class="empty-icon">👑</div><div>등록된 팀장 계정이 없습니다</div></div>';
  } else {
    html += '<table class="tbl"><thead><tr><th>#</th><th>사번</th><th>이름</th><th>관리 팀</th><th>관리</th></tr></thead><tbody>';
    entries.forEach(function(e,i){
      var id=e[0], ldr=e[1];
      var teamsArr = ldr.teams || [ldr.dept||'-'];
      var teamsHtml = teamsArr.map(function(t){ return '<span class="tag" style="margin-right:4px">'+h(t)+'</span>'; }).join('');
      html += '<tr><td style="color:var(--text4)">'+(i+1)+'</td><td style="font-family:monospace;font-size:11px;color:var(--dw)">'+h(id)+'</td><td style="font-weight:700">'+h(ldr.name)+'</td><td>'+teamsHtml+'</td>';
      html += '<td><button class="btn btn-d btn-sm" onclick="deleteLeader(\''+id+'\')">삭제</button></td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  el('admin-body').innerHTML = html;
}

async function loadLeadersFromSheets(){
  if(!scriptUrl){ toast('설정 탭에서 URL을 먼저 입력하세요'); return; }
  var sheet = val('l-sheet') || '관리자';
  var stEl  = el('l-status');
  if(stEl) stEl.innerHTML='<span style="color:var(--dw)">불러오는 중...</span>';
  try{
    var res  = await fetch(scriptUrl+'?sheet='+encodeURIComponent(sheet), {redirect:'follow'});
    var json = await res.json();
    if(!Array.isArray(json)||json.length<2){
      if(stEl) stEl.innerHTML='<span style="color:var(--red)">데이터 없음</span>'; return;
    }
    var rows = json.slice(1).filter(function(r){ return r.some(function(c){ return c!==''; }); });
    // 한 사번에 여러 행 → teams 배열로 합산
    var newLeaders = {};
    rows.forEach(function(r){
      var id=String(r[0]||'').trim(), name=String(r[1]||'').trim();
      var dept=String(r[2]||'').trim(), pw=String(r[3]||'').trim();
      if(!id||!name||!pw) return;
      if(!newLeaders[id]){
        newLeaders[id]={name:name, dept:dept, pw:pw, teams:[]};
      }
      if(dept && !newLeaders[id].teams.includes(dept)){
        newLeaders[id].teams.push(dept);
      }
    });
    // 기존 leaders에 병합
    var added=0, updated=0;
    Object.entries(newLeaders).forEach(function(e){
      var id=e[0], ldr=e[1];
      if(leaders[id]) updated++; else added++;
      leaders[id]=ldr;
    });
    saveLeaders();
    if(stEl) stEl.innerHTML='<span style="color:var(--green)">✅ 추가 '+added+'명 · 업데이트 '+updated+'명</span>';
    toast('✅ '+added+'명 추가, '+updated+'명 업데이트');
    renderAdminLeaders();
  }catch(err){
    if(stEl) stEl.innerHTML='<span style="color:var(--red)">오류: '+err.message+'</span>';
  }
}

function addLeader(){
  var id=val('new-id'), name=val('new-name'), dept=val('new-dept'), pw=val('new-pw');
  if(!id||!name||!dept||!pw){ toast('모든 항목을 입력해주세요'); return; }
  if(leaders[id]){
    // 기존 계정에 팀 추가
    if(!leaders[id].teams.includes(dept)) leaders[id].teams.push(dept);
    toast('✅ '+name+' 팀장에 '+dept+' 팀 추가됨');
  } else {
    leaders[id]={name:name, dept:dept, pw:pw, teams:[dept]};
    toast('✅ '+name+' 팀장 추가됨 ('+dept+')');
  }
  saveLeaders();
  renderAdminLeaders();
}

function deleteLeader(id){
  if(!confirm(leaders[id].name+' 팀장 계정을 삭제하시겠습니까?')) return;
  delete leaders[id];
  saveLeaders();
  renderAdminLeaders();
  toast('삭제됐습니다');
}

/* -- 설정 탭 -- */
function renderAdminSettings(){
  var html = '<div class="fcard"><div class="fcard-title">Apps Script URL</div>';
  html += '<div style="margin-bottom:11px"><label class="fl">Google Apps Script 웹 앱 URL</label>';
  html += '<input class="fi" id="s-url" value="'+h(scriptUrl)+'" placeholder="https://script.google.com/macros/s/.../exec"></div>';
  html += '<div style="display:flex;gap:8px;align-items:center">';
  html += '<button class="btn btn-p" onclick="saveUrl()">💾 저장</button>';
  html += '<a href="'+SHEET_URL+'" target="_blank" class="btn btn-s">📊 구글 시트 열기</a>';
  html += '</div>';
  html += '<div class="fhint" style="margin-top:8px">doGet으로 시트 데이터를 반환하는 Apps Script URL을 입력하세요</div></div>';

  html += '<div class="fcard"><div class="fcard-title">데이터 초기화</div>';
  html += '<div style="font-size:13px;color:var(--text3);margin-bottom:14px">저장된 심의결과 데이터와 팀장 계정 정보를 모두 초기화합니다.</div>';
  html += '<button class="btn btn-d" onclick="if(confirm(\'모든 데이터를 초기화하시겠습니까?\')){localStorage.clear();location.reload();}">⚠ 전체 초기화</button></div>';
  el('admin-body').innerHTML = html;
}

function saveUrl(){
  scriptUrl = val('s-url');
  localStorage.setItem('prom_url', scriptUrl);
  toast('✅ URL이 저장됐습니다');
  renderAdminSettings();
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDetailModal(); });
</script>
